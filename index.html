<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炭火串焼 注文レジ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f0f10; color: #f4f4f5; font-family: 'Noto Sans JP', sans-serif; }
        .wood-texture { background-color: #24140b; background-image: radial-gradient(#3d2314 1px, transparent 1px); background-size: 16px 16px; }
        .active-btn { border-color: #fbbf24 !important; background-color: rgba(251, 191, 36, 0.2) !important; color: #fbbf24 !important; box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <!-- Header -->
    <header class="wood-texture border-b border-amber-900/60 sticky top-0 z-30 shadow-xl">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-amber-600 rounded-lg flex items-center justify-center font-black text-xl text-white shadow-lg border border-amber-400">鳥</div>
                <div>
                    <h1 class="font-black text-lg md:text-xl text-amber-400">炭火串焼 注文レジ</h1>
                    <p class="text-xs text-amber-200/70">スプレッドシート自動転記・集計システム</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="gasStatusBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-950/80 text-red-400 border border-red-800">
                    <span class="w-2 h-2 mr-2 rounded-full bg-red-500 animate-pulse"></span>GAS未設定
                </span>
                <button onclick="openGasModal()" class="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-amber-300 border border-amber-700 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-gear mr-1"></i>連携設定 & GASコード
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Selection Form -->
        <section class="lg:col-span-7 space-y-4">
            <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 shadow-xl space-y-5">
                
                <!-- 1. 種類選択 -->
                <div>
                    <label class="block text-xs font-bold text-amber-400 mb-2">1. 種類を選択 <span class="text-red-400">*</span></label>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" onclick="selectType('もも')" id="btn-type-もも" class="type-btn py-3 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-bold hover:border-amber-500 transition">もも</button>
                        <button type="button" onclick="selectType('ねぎま')" id="btn-type-ねぎま" class="type-btn py-3 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-bold hover:border-amber-500 transition flex flex-col items-center justify-center">
                            <span>ねぎま</span><span class="text-[10px] text-amber-500 font-normal">たれ固定</span>
                        </button>
                        <button type="button" onclick="selectType('つくね')" id="btn-type-つくね" class="type-btn py-3 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-bold hover:border-amber-500 transition flex flex-col items-center justify-center">
                            <span>つくね</span><span class="text-[10px] text-amber-500 font-normal">たれ固定</span>
                        </button>
                    </div>
                </div>

                <!-- 2. 味選択 -->
                <div>
                    <label class="block text-xs font-bold text-amber-400 mb-2">2. 味を選択 <span class="text-red-400">*</span></label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectFlavor('たれ')" id="btn-flavor-たれ" class="flavor-btn py-3 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-bold hover:border-amber-500 transition">たれ</button>
                        <button type="button" onclick="selectFlavor('塩')" id="btn-flavor-塩" class="flavor-btn py-3 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-bold hover:border-amber-500 transition">塩</button>
                    </div>
                </div>

                <!-- 3. トッピング選択 -->
                <div>
                    <label class="block text-xs font-bold text-amber-400 mb-2">3. トッピングを選択 <span class="text-red-400">*</span></label>
                    <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                        <button type="button" onclick="selectTopping('マヨネーズ')" id="btn-topping-マヨネーズ" class="topping-btn py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-semibold text-xs hover:border-amber-500 transition">マヨネーズ</button>
                        <button type="button" onclick="selectTopping('ポッカレモン')" id="btn-topping-ポッカレモン" class="topping-btn py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-semibold text-xs hover:border-amber-500 transition">ポッカレモン</button>
                        <button type="button" onclick="selectTopping('粉チーズ')" id="btn-topping-粉チーズ" class="topping-btn py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-semibold text-xs hover:border-amber-500 transition">粉チーズ</button>
                        <button type="button" onclick="selectTopping('七味')" id="btn-topping-七味" class="topping-btn py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-semibold text-xs hover:border-amber-500 transition">七味</button>
                        <button type="button" onclick="selectTopping('なし')" id="btn-topping-なし" class="topping-btn py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-zinc-200 font-semibold text-xs hover:border-amber-500 transition">なし</button>
                    </div>
                </div>

                <!-- Preview -->
                <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex items-center justify-between text-xs">
                    <span class="text-zinc-400">現在選択中:</span>
                    <span id="previewText" class="font-bold text-amber-300">未選択 / 未選択 / 未選択</span>
                </div>

                <!-- Add Button -->
                <button type="button" onclick="addItemToCart()" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white font-black text-base rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> リストに追加する
                </button>
            </div>
        </section>

        <!-- Cart Section -->
        <section class="lg:col-span-5 space-y-4">
            <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 shadow-xl flex flex-col">
                <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-3">
                    <h2 class="font-bold text-base text-white flex items-center">
                        <i class="fa-solid fa-receipt text-amber-500 mr-2"></i>現在の注文（1客分）
                    </h2>
                    <span id="cartCountBadge" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-xs font-bold px-2.5 py-0.5 rounded-full">0 食</span>
                </div>

                <!-- リスト一覧エリア -->
                <div id="cartList" class="space-y-2 overflow-y-auto max-h-[400px] min-h-[200px] pr-1">
                    <div id="cartEmptyState" class="h-40 flex flex-col items-center justify-center text-zinc-500 space-y-2 border border-dashed border-zinc-800 rounded-xl">
                        <i class="fa-solid fa-utensils text-2xl opacity-40"></i>
                        <p class="text-xs">追加された串がここに表示されます</p>
                    </div>
                </div>

                <div class="border-t border-zinc-800 pt-4 mt-3 space-y-2">
                    <button type="button" id="submitOrderBtn" onclick="submitOrder()" disabled class="w-full py-4 bg-zinc-800 text-zinc-500 font-black text-base rounded-xl border border-zinc-700 flex items-center justify-center gap-2 cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane"></i> 注文を確定して送信
                    </button>
                    <button type="button" onclick="clearCart()" class="w-full py-2 text-xs text-zinc-500 hover:text-zinc-300 transition">リストをクリア</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal & Toast -->
    <div id="gasModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-amber-400">連携設定</h3>
                <button onclick="closeGasModal()" class="text-zinc-400 text-lg">&times;</button>
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-300 mb-1">Web アプリ URL</label>
                <div class="flex gap-2">
                    <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 bg-zinc-950 border border-zinc-700 rounded p-2 text-xs text-white">
                    <button onclick="saveGasUrl()" class="bg-amber-600 text-white px-4 py-2 rounded text-xs font-bold">保存</button>
                </div>
            </div>
            <button onclick="closeGasModal()" class="w-full py-2 bg-zinc-800 text-xs font-bold rounded text-zinc-300">閉じる</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-zinc-800 border border-amber-500 text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none text-xs font-bold"></div>

    <script>
        // グローバル変数として注文カートを保持（ボタンを押すたびにクリアされないようにする）
        var cart = [];
        var currentOrder = { type: null, flavor: null, topping: null };
        var gasUrl = localStorage.getItem('yakitori_gas_url') || '';

        window.onload = function() {
            initGasStatus();
            updatePreview();
            renderCart();
        };

        function initGasStatus() {
            var badge = document.getElementById('gasStatusBadge');
            var urlInput = document.getElementById('gasUrlInput');
            if (gasUrl) {
                if(urlInput) urlInput.value = gasUrl;
                badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800";
                badge.innerHTML = '<span class="w-2 h-2 mr-2 rounded-full bg-emerald-400"></span>GAS設定完了';
            } else {
                badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-800";
                badge.innerHTML = '<span class="w-2 h-2 mr-2 rounded-full bg-red-500 animate-pulse"></span>GAS未設定';
            }
        }

        function updatePreview() {
            var preview = document.getElementById('previewText');
            var t = currentOrder.type || '未選択';
            var f = currentOrder.flavor || '未選択';
            var top = currentOrder.topping || '未選択';
            preview.textContent = t + ' / ' + f + ' / ' + top;
        }

        function selectType(typeName) {
            currentOrder.type = typeName;
            document.querySelectorAll('.type-btn').forEach(function(b) { b.classList.remove('active-btn'); });
            var btn = document.getElementById('btn-type-' + typeName);
            if(btn) btn.classList.add('active-btn');

            var btnShio = document.getElementById('btn-flavor-塩');
            var btnTare = document.getElementById('btn-flavor-たれ');

            if (typeName === 'ねぎま' || typeName === 'つくね') {
                currentOrder.flavor = 'たれ';
                if(btnTare) btnTare.classList.add('active-btn');
                if(btnShio) {
                    btnShio.classList.remove('active-btn');
                    btnShio.disabled = true;
                    btnShio.classList.add('opacity-40');
                }
            } else {
                if(btnShio) {
                    btnShio.disabled = false;
                    btnShio.classList.remove('opacity-40');
                }
            }
            updatePreview();
        }

        function selectFlavor(flavorName) {
            if ((currentOrder.type === 'ねぎま' || currentOrder.type === 'つくね') && flavorName === '塩') {
                showToast('ねぎま・つくねは「たれ」固定です');
                return;
            }
            currentOrder.flavor = flavorName;
            document.querySelectorAll('.flavor-btn').forEach(function(b) { b.classList.remove('active-btn'); });
            var btn = document.getElementById('btn-flavor-' + flavorName);
            if(btn) btn.classList.add('active-btn');
            updatePreview();
        }

        function selectTopping(toppingName) {
            currentOrder.topping = toppingName;
            document.querySelectorAll('.topping-btn').forEach(function(b) { b.classList.remove('active-btn'); });
            var btn = document.getElementById('btn-topping-' + toppingName);
            if(btn) btn.classList.add('active-btn');
            updatePreview();
        }

        function addItemToCart() {
            if (!currentOrder.type) return showToast('1. 種類を選択してください');
            if (!currentOrder.flavor) return showToast('2. 味を選択してください');
            if (!currentOrder.topping) return showToast('3. トッピングを選択してください');

            // 配列に末尾追加
            cart.push({
                type: currentOrder.type,
                flavor: currentOrder.flavor,
                topping: currentOrder.topping
            });

            showToast(currentOrder.type + ' を追加しました');
            resetSelectionForm();
            renderCart();
        }

        function resetSelectionForm() {
            currentOrder = { type: null, flavor: null, topping: null };
            document.querySelectorAll('.type-btn, .flavor-btn, .topping-btn').forEach(function(b) {
                b.classList.remove('active-btn');
                b.disabled = false;
                b.classList.remove('opacity-40');
            });
            updatePreview();
        }

        // リスト再描画処理
        function renderCart() {
            var listContainer = document.getElementById('cartList');
            var submitBtn = document.getElementById('submitOrderBtn');
            var badge = document.getElementById('cartCountBadge');

            if (!listContainer) return;

            badge.textContent = cart.length + ' 食';

            if (cart.length === 0) {
                listContainer.innerHTML = '<div id="cartEmptyState" class="h-40 flex flex-col items-center justify-center text-zinc-500 space-y-2 border border-dashed border-zinc-800 rounded-xl"><i class="fa-solid fa-utensils text-2xl opacity-40"></i><p class="text-xs">追加された串がここに表示されます</p></div>';
                submitBtn.disabled = true;
                submitBtn.className = "w-full py-4 bg-zinc-800 text-zinc-500 font-black text-base rounded-xl border border-zinc-700 flex items-center justify-center gap-2 cursor-not-allowed";
                return;
            }

            var html = '';
            for (var i = 0; i < cart.length; i++) {
                var item = cart[i];
                // item.type を直接参照して undefined を解消
                html += '<div class="bg-zinc-950 border border-amber-900/40 rounded-xl p-3 flex items-center justify-between shadow-md">';
                html += '  <div class="flex items-center space-x-3">';
                html += '    <div class="w-7 h-7 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg flex items-center justify-center font-black text-xs shrink-0">' + (i + 1) + '</div>';
                html += '    <div>';
                html += '      <div class="font-black text-sm text-amber-300 flex items-center gap-2">';
                html += '        <span>' + item.type + '</span>';
                html += '        <span class="bg-zinc-800 text-zinc-300 text-[10px] px-2 py-0.5 rounded border border-zinc-700 font-normal">' + item.flavor + '</span>';
                html += '      </div>';
                html += '      <div class="text-xs text-zinc-400 mt-0.5">トッピング: <span class="text-zinc-200 font-bold">' + item.topping + '</span></div>';
                html += '    </div>';
                html += '  </div>';
                html += '  <button type="button" onclick="removeFromCart(' + i + ')" class="text-zinc-500 hover:text-red-400 p-2 rounded-lg hover:bg-zinc-900 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>';
                html += '</div>';
            }

            listContainer.innerHTML = html;

            submitBtn.disabled = false;
            submitBtn.className = "w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-xl shadow-lg border border-emerald-400 flex items-center justify-center gap-2 cursor-pointer transition";
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        async function submitOrder() {
            if (cart.length === 0) return;
            if (!gasUrl) {
                showToast('GAS URLが未設定です');
                openGasModal();
                return;
            }

            var btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 送信中...';

            try {
                var response = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ items: cart })
                });

                var result = await response.json();
                if (result.status === 'success') {
                    showToast('スプレッドシートへ送信が完了しました！');
                    cart = [];
                    renderCart();
                    resetSelectionForm();
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                showToast('送信エラー: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 注文を確定して送信';
            }
        }

        function openGasModal() { document.getElementById('gasModal').classList.remove('hidden'); }
        function closeGasModal() { document.getElementById('gasModal').classList.add('hidden'); }

        function saveGasUrl() {
            var input = document.getElementById('gasUrlInput').value.trim();
            if (input) {
                gasUrl = input;
                localStorage.setItem('yakitori_gas_url', input);
                initGasStatus();
                closeGasModal();
                showToast('URLを保存しました');
            }
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(function() { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2500);
        }
    </script>
</body>
</html>

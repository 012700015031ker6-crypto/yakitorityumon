<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炭火串焼 注文レジ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .active { border-color: #f59e0b !important; background-color: #78350f !important; color: #fbbf24 !important; }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

    <h1 class="text-xl font-bold text-amber-500 mb-4">炭火串焼 注文レジ</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 選択エリア -->
        <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-4">
            <div>
                <label class="block text-xs font-bold text-amber-400 mb-1">1. 種類</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="btn-type border border-zinc-700 bg-zinc-800 p-2 rounded text-sm" onclick="selectType('もも', this)">もも</button>
                    <button type="button" class="btn-type border border-zinc-700 bg-zinc-800 p-2 rounded text-sm" onclick="selectType('ねぎま', this)">ねぎま</button>
                    <button type="button" class="btn-type border border-zinc-700 bg-zinc-800 p-2 rounded text-sm" onclick="selectType('つくね', this)">つくね</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-amber-400 mb-1">2. 味</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btn-tare" class="btn-flavor border border-zinc-700 bg-zinc-800 p-2 rounded text-sm" onclick="selectFlavor('たれ', this)">たれ</button>
                    <button type="button" id="btn-shio" class="btn-flavor border border-zinc-700 bg-zinc-800 p-2 rounded text-sm" onclick="selectFlavor('塩', this)">塩</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-amber-400 mb-1">3. トッピング</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="btn-topping border border-zinc-700 bg-zinc-800 p-2 rounded text-xs" onclick="selectTopping('マヨネーズ', this)">マヨネーズ</button>
                    <button type="button" class="btn-topping border border-zinc-700 bg-zinc-800 p-2 rounded text-xs" onclick="selectTopping('ポッカレモン', this)">ポッカレモン</button>
                    <button type="button" class="btn-topping border border-zinc-700 bg-zinc-800 p-2 rounded text-xs" onclick="selectTopping('粉チーズ', this)">粉チーズ</button>
                    <button type="button" class="btn-topping border border-zinc-700 bg-zinc-800 p-2 rounded text-xs" onclick="selectTopping('七味', this)">七味</button>
                    <button type="button" class="btn-topping border border-zinc-700 bg-zinc-800 p-2 rounded text-xs" onclick="selectTopping('なし', this)">なし</button>
                </div>
            </div>

            <button type="button" onclick="addToList()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold p-3 rounded-lg mt-4">
                リストに追加する
            </button>
        </div>

        <!-- カート表示エリア -->
        <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2 mb-3">
                    <h2 class="font-bold text-amber-400">注文リスト</h2>
                    <span id="count" class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded">0件</span>
                </div>
                
                <div id="cartDisplay" class="space-y-2 max-h-80 overflow-y-auto">
                    <p class="text-xs text-zinc-500 text-center py-8">選択して追加ボタンを押してください</p>
                </div>
            </div>

            <button type="button" onclick="clearAll()" class="w-full bg-zinc-800 text-zinc-400 text-xs py-2 rounded mt-4 hover:bg-zinc-700">
                すべてクリア
            </button>
        </div>
    </div>

    <script>
        // 注文データを保持する配列（グローバル）
        var cartData = [];
        
        // 現在選択中の状態
        var selected = { type: '', flavor: '', topping: '' };

        function selectType(val, el) {
            selected.type = val;
            document.querySelectorAll('.btn-type').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            // ねぎま・つくねは「たれ」固定
            var shioBtn = document.getElementById('btn-shio');
            var tareBtn = document.getElementById('btn-tare');
            if (val === 'ねぎま' || val === 'つくね') {
                selectFlavor('たれ', tareBtn);
                shioBtn.disabled = true;
                shioBtn.classList.add('opacity-30');
            } else {
                shioBtn.disabled = false;
                shioBtn.classList.remove('opacity-30');
            }
        }

        function selectFlavor(val, el) {
            selected.flavor = val;
            document.querySelectorAll('.btn-flavor').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function selectTopping(val, el) {
            selected.topping = val;
            document.querySelectorAll('.btn-topping').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // リスト追加処理
        function addToList() {
            if (!selected.type || !selected.flavor || !selected.topping) {
                alert('「種類」「味」「トッピング」をすべて選択してください。');
                return;
            }

            // 配列に末尾追加
            cartData.push({
                type: selected.type,
                flavor: selected.flavor,
                topping: selected.topping
            });

            // 画面を更新
            updateCartDisplay();
        }

        // 画面描画処理
        function updateCartDisplay() {
            var container = document.getElementById('cartDisplay');
            var countEl = document.getElementById('count');
            
            countEl.textContent = cartData.length + '件';

            if (cartData.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">選択して追加ボタンを押してください</p>';
                return;
            }

            var html = '';
            for (var i = 0; i < cartData.length; i++) {
                var item = cartData[i];
                html += '<div class="bg-zinc-950 p-3 rounded border border-zinc-800 flex justify-between items-center text-sm">';
                html += '  <div>';
                html += '    <span class="font-bold text-amber-300">' + (i + 1) + '. ' + item.type + '</span>';
                html += '    <span class="text-xs bg-zinc-800 px-1.5 py-0.5 rounded ml-2">' + item.flavor + '</span>';
                html += '    <div class="text-xs text-zinc-400 mt-1">トッピング: ' + item.topping + '</div>';
                html += '  </div>';
                html += '  <button type="button" onclick="removeItem(' + i + ')" class="text-zinc-500 hover:text-red-400 text-xs px-2 py-1">削除</button>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function removeItem(index) {
            cartData.splice(index, 1);
            updateCartDisplay();
        }

        function clearAll() {
            cartData = [];
            updateCartDisplay();
        }
    </script>
</body>
</html>
